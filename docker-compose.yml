# Builds this checkout, configured by `.env` (see `.env.example`). Deployments
# use `docker-compose.prod.yml` instead, which pulls the published image.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${PORT:-3700}:${PORT:-3700}"
    stop_grace_period: 10s
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1:$${PORT:-3700}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
